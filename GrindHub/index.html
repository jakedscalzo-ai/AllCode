<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03060f">
<title>Grind Hub — Dashboard</title>

<style>
:root {
  --bg: #03060f;
  --bg-soft: #070b14;
  --panel: #0b0f19;
  --panel-2: #10172a;
  --panel-3: #131c32;

  --line: #1c2943;
  --line-light: #2a3b5f;

  --text: #f4f7ff;
  --muted: #7889a8;

  --cyan: #00f0ff;
  --purple: #bd00ff;
  --green: #00ff87;
  --yellow: #ffbd00;
  --red: #ff2d63;

  --radius: 18px;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  padding-bottom: 70px;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at 15% -10%,
      rgba(90,0,180,.35),
      transparent 38%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(0,180,255,.12),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #03060f 0%,
      #040712 100%
    );
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: #050913;
}

::-webkit-scrollbar-thumb {
  background: #1c2a45;
  border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
  background: #294064;
}


/* =========================
   APP
========================= */

.app {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}


/* =========================
   CLOCK
========================= */

.top-center-clock {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);

  text-align: center;

  z-index: 100;
  pointer-events: none;
}

.time-text {
  display: inline-block;

  padding: 5px 15px;

  color: var(--cyan);

  font-size: 20px;
  font-weight: 900;

  letter-spacing: .6px;

  background: rgba(0,240,255,.045);

  border: 1px solid rgba(0,240,255,.14);

  border-radius: 10px;

  box-shadow:
    0 0 25px rgba(0,240,255,.07),
    inset 0 0 20px rgba(0,240,255,.02);
}

.date-text {
  margin-top: 5px;

  color: var(--muted);

  font-size: 10px;
  font-weight: 800;

  text-transform: uppercase;
  letter-spacing: 1.3px;
}


/* =========================
   HEADER
========================= */

header {
  position: relative;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 20px;

  padding: 82px 0 22px;

  margin-bottom: 24px;

  border-bottom: 1px solid var(--line);
}

.brand h1 {
  margin: 0;

  font-size: clamp(25px,4vw,32px);

  font-weight: 950;

  letter-spacing: 1.5px;

  color: #fff;

  text-shadow:
    0 0 20px rgba(0,240,255,.18);
}

.brand p {
  margin: 5px 0 0;

  color: var(--muted);

  font-size: 13px;
  font-weight: 600;
}


/* =========================
   BUTTONS
========================= */

.btn {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  min-height: 42px;

  padding: 10px 17px;

  color: var(--text);

  background: var(--panel-2);

  border: 1px solid var(--line);

  border-radius: 11px;

  font-size: 13px;
  font-weight: 800;

  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.btn:hover {
  transform: translateY(-2px);

  border-color: var(--cyan);

  box-shadow:
    0 8px 25px rgba(0,240,255,.12);
}

.btn:active {
  transform: translateY(0);
}

.btn.primary {
  color: #02040a;

  border: 0;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      #3ce4ff 35%,
      var(--purple)
    );

  box-shadow:
    0 8px 30px rgba(0,240,255,.12);
}

.btn.primary:hover {
  color: #02040a;

  box-shadow:
    0 10px 35px rgba(189,0,255,.28);
}

.btn.danger {
  min-height: 34px;

  padding: 7px 11px;

  color: var(--red);

  background: rgba(255,45,99,.07);

  border-color:
    rgba(255,45,99,.35);

  font-size: 11px;
}

.btn.danger:hover {
  color: white;

  background: var(--red);

  border-color: var(--red);
}

.btn.green {
  color: var(--green);

  background: rgba(0,255,135,.06);

  border-color:
    rgba(0,255,135,.22);
}

.btn.green:hover {
  color: #00140b;

  background: var(--green);
}


/* =========================
   HEADER NAVIGATION
========================= */

.file-buttons {
  display: flex;

  align-items: center;

  justify-content: flex-end;

  flex-wrap: wrap;

  gap: 10px;

  /*
    Move the normal buttons slightly
    left so ALL PROJECTS has room.
  */
  padding-right: 145px;
}




/* =========================
   ALL PROJECTS BUTTON
========================= */

.all-projects-button {
  position: fixed;

  top: 16px;
  right: 150px;

  z-index: 200;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-height: 48px;

  padding: 12px 20px;

  color: #00f0ff;

  background: #000;

  border: 2px solid #00f0ff;

  border-radius: 12px;

  font-size: 14px;

  font-weight: 950;

  letter-spacing: 1px;

  text-decoration: none;

  box-shadow:
    0 0 8px rgba(0,240,255,.55),
    0 0 20px rgba(0,240,255,.25),
    inset 0 0 12px rgba(0,240,255,.06);

  transition:
    transform .2s ease,
    color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.all-projects-button:hover {
  color: #000;

  background: #00f0ff;

  border-color: #00f0ff;

  transform: translateY(-2px);

  box-shadow:
    0 0 12px rgba(0,240,255,.9),
    0 0 35px rgba(0,240,255,.65),
    0 0 60px rgba(0,240,255,.3);
}

.all-projects-button:active {
  transform: translateY(0);
}


/* =========================
   NEW LIST BUTTON
   NOW USES FORTNITE'S
   OLD POSITION
========================= */

.file-buttons > button.primary {
  position: static;

  min-height: 58px;

  padding: 14px 24px;

  border-radius: 14px;

  font-size: 16px;

  font-weight: 900;
}


/* =========================
   OVERDUE BUTTONS
========================= */

.file-buttons > a.btn.overdue-button {
  color: #fff;

  background:
    linear-gradient(
      135deg,
      #ff1744,
      #ff2d63 50%,
      #c40032
    );

  border-color:
    #ff2d63;

  box-shadow:
    0 0 18px rgba(255,45,99,.4),
    0 8px 30px rgba(255,45,99,.2);

  animation:
    overdueButtonPulse 1.2s ease-in-out infinite;
}

.file-buttons > a.btn.overdue-button:hover {
  color: #fff;

  background:
    linear-gradient(
      135deg,
      #ff1744,
      #ff003c
    );

  border-color:
    #ff6687;

  box-shadow:
    0 0 30px rgba(255,45,99,.7);
}

@keyframes overdueButtonPulse {

  0%,
  100% {
    box-shadow:
      0 0 18px rgba(255,45,99,.35),
      0 8px 25px rgba(255,45,99,.15);
  }

  50% {
    box-shadow:
      0 0 32px rgba(255,45,99,.7),
      0 10px 35px rgba(255,45,99,.3);
  }

}


/* =========================
   HUB CARDS
========================= */

.hub-grid {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 16px;

  margin-bottom: 28px;
}

.hub-card {
  position: relative;

  overflow: hidden;

  min-height: 155px;

  padding: 24px;

  display: flex;

  flex-direction: column;

  justify-content: space-between;

  text-decoration: none;

  background:
    linear-gradient(
      145deg,
      rgba(16,25,46,.96),
      rgba(6,10,20,.98)
    );

  border: 1px solid var(--line);

  border-radius: 20px;

  box-shadow: var(--shadow);

  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.hub-card:hover {
  transform: translateY(-5px);

  border-color:
    rgba(0,240,255,.55);

  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    0 0 25px rgba(0,240,255,.08);
}

.hub-card h3 {
  margin: 0 0 9px;

  color: #fff;

  font-size: 20px;
  font-weight: 900;
}

.hub-card p {
  margin: 0;

  max-width: 290px;

  color: var(--muted);

  font-size: 13px;

  line-height: 1.55;
}

.badge {
  align-self: flex-start;

  margin-top: 18px;

  padding: 7px 12px;

  color: var(--cyan);

  background:
    rgba(0,240,255,.055);

  border:
    1px solid rgba(0,240,255,.16);

  border-radius: 8px;

  font-size: 10px;
  font-weight: 900;

  text-transform: uppercase;
}


/* =========================
   TABS
========================= */

.tabs {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 8px;

  padding: 6px;

  margin-bottom: 20px;

  background:
    rgba(7,11,20,.9);

  border:
    1px solid var(--line);

  border-radius: 14px;
}

.tab {
  min-height: 42px;

  color: var(--muted);

  background: transparent;

  border: 0;

  border-radius: 9px;

  font-size: 12px;
  font-weight: 900;

  text-transform: uppercase;

  letter-spacing: .5px;

  transition: .2s ease;
}

.tab:hover {
  color: #fff;

  background:
    rgba(255,255,255,.035);
}

.tab.active {
  color: #02040a;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      #52eaff
    );

  box-shadow:
    0 4px 20px rgba(0,240,255,.16);
}


/* =========================
   VIEW HEADER
========================= */

.view-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 15px;

  margin-bottom: 15px;
}

.view-header h2 {
  margin: 0;

  color: #fff;

  font-size: 18px;
  font-weight: 900;

  letter-spacing: .4px;
}

.view-subtitle {
  margin-top: 4px;

  color: var(--muted);

  font-size: 11px;
  font-weight: 700;
}


/* =========================
   LIST DASHBOARD
========================= */

.list-container {
  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 20px;
}

.dynamic-list-card {
  min-width: 0;

  display: flex;

  flex-direction: column;

  gap: 15px;

  padding: 20px;

  background:
    linear-gradient(
      145deg,
      rgba(10,16,29,.98),
      rgba(5,9,17,.98)
    );

  border: 1px solid var(--line);

  border-radius: 20px;

  box-shadow: var(--shadow);
}

.list-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  padding-bottom: 13px;

  border-bottom:
    1px dashed var(--line);
}

.list-title-wrap {
  min-width: 0;
}

.list-header h2 {
  overflow: hidden;

  margin: 0;

  color: #fff;

  font-size: 17px;
  font-weight: 900;

  text-transform: uppercase;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.list-count {
  margin-top: 3px;

  color: var(--muted);

  font-size: 10px;
  font-weight: 800;

  text-transform: uppercase;
}

.item-box {
  display: flex;

  flex-direction: column;

  gap: 9px;

  max-height: 390px;

  overflow-y: auto;

  padding-right: 3px;
}


/* =========================
   TASK ROW
========================= */

.todo-row {
  display: grid;

  grid-template-columns:
    auto minmax(0,1fr) auto auto;

  align-items: center;

  gap: 10px;

  padding: 12px;

  background:
    rgba(11,16,28,.92);

  border: 1px solid var(--line);

  border-radius: 13px;

  transition: .2s ease;
}

.todo-row:hover {
  background: #0d1423;

  border-color:
    var(--line-light);
}

.todo-row.overdue {
  background:
    linear-gradient(
      90deg,
      rgba(255,45,99,.15),
      rgba(255,45,99,.035)
    );

  border-color:
    rgba(255,45,99,.5);
}

.todo-row.done {
  opacity: .48;

  background: #04070d !important;

  border-color:
    rgba(30,41,66,.45) !important;
}

.todo-row input[type="checkbox"] {
  width: 18px;
  height: 18px;

  margin: 0;

  accent-color: var(--cyan);
}

.todo-row label {
  min-width: 0;

  color: #e9eef9;

  font-size: 13px;

  line-height: 1.45;

  font-weight: 650;

  cursor: pointer;

  overflow-wrap: anywhere;
}

.todo-row.done label {
  color: var(--muted);

  text-decoration: line-through;
}


/* =========================
   TASK META
========================= */

.todo-meta {
  min-width: 105px;

  display: flex;

  flex-direction: column;

  align-items: flex-end;

  gap: 5px;
}

.meta-target {
  display: inline-block;

  padding: 4px 7px;

  color: var(--cyan);

  background:
    rgba(0,240,255,.05);

  border:
    1px solid rgba(0,240,255,.13);

  border-radius: 6px;

  font-size: 11px;
  font-weight: 850;

  white-space: nowrap;
}

.meta-date {
  display: inline-block;

  padding: 4px 7px;

  color: var(--purple);

  background:
    rgba(189,0,255,.06);

  border:
    1px solid rgba(189,0,255,.16);

  border-radius: 6px;

  font-size: 10px;
  font-weight: 850;

  white-space: nowrap;
}

.todo-row.overdue .meta-target {
  color: white;

  background: var(--red);

  border-color: transparent;
}

.days-badge-row {
  display: flex;

  flex-wrap: wrap;

  justify-content: flex-end;

  gap: 2px;
}

.mini-day-pill {
  padding: 2px 4px;

  color: #657695;

  background: #111b31;

  border-radius: 4px;

  font-size: 8px;
  font-weight: 900;

  text-transform: uppercase;
}

.mini-day-pill.active {
  color: white;

  background: var(--purple);
}


/* =========================
   ACTION BUTTONS
========================= */

.action-icon-btn {
  width: 30px;
  height: 30px;

  display: grid;

  place-items: center;

  padding: 0;

  color: var(--muted);

  background: transparent;

  border:
    1px solid transparent;

  border-radius: 8px;

  transition: .2s ease;
}

.action-icon-btn:hover {
  color: var(--cyan);

  background:
    rgba(0,240,255,.06);

  border-color:
    rgba(0,240,255,.12);
}

.action-icon-btn.delete:hover {
  color: var(--red);

  background:
    rgba(255,45,99,.08);

  border-color:
    rgba(255,45,99,.14);
}


/* =========================
   EMPTY
========================= */

.empty {
  padding: 30px 18px;

  color: var(--muted);

  background:
    rgba(7,11,20,.8);

  border:
    1px dashed var(--line);

  border-radius: 12px;

  font-size: 12px;

  font-weight: 600;

  text-align: center;
}

.empty strong {
  color: #fff;
}


/* =========================
   MODALS
========================= */

.modal {
  position: fixed;

  inset: 0;

  z-index: 500;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 18px;

  background:
    rgba(1,2,6,.82);

  backdrop-filter: blur(10px);
}

.modal.open {
  display: flex;

  animation: fadeIn .18s ease;
}

.modal-box {
  width: min(520px,100%);

  max-height:
    calc(100vh - 36px);

  overflow-y: auto;

  padding: 25px;

  background:
    linear-gradient(
      145deg,
      #0a0f1b,
      #050912
    );

  border:
    1px solid var(--line-light);

  border-radius: 22px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.8),
    0 0 40px rgba(0,240,255,.04);

  animation: modalIn .22s ease;
}

.modal-head {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 22px;
}

.modal-head h2 {
  margin: 0;

  color: #fff;

  font-size: 19px;
  font-weight: 900;
}

.close {
  width: 34px;
  height: 34px;

  display: grid;

  place-items: center;

  color: var(--muted);

  background: #121a2c;

  border: 0;

  border-radius: 9px;

  font-weight: 900;
}

.close:hover {
  color: #fff;

  background: var(--red);
}


/* =========================
   FORMS
========================= */

form {
  display: flex;

  flex-direction: column;

  gap: 17px;
}

form label {
  display: block;

  margin-bottom: 7px;

  color: var(--muted);

  font-size: 10px;
  font-weight: 900;

  text-transform: uppercase;

  letter-spacing: .6px;
}

input,
select {
  width: 100%;

  padding: 12px;

  color: white;

  background: #03060f;

  border:
    1px solid var(--line);

  border-radius: 11px;

  outline: none;

  transition: .2s ease;
}

input::placeholder {
  color: #465675;
}

input:focus,
select:focus {
  border-color: var(--cyan);

  box-shadow:
    0 0 0 3px rgba(0,240,255,.07);
}

input[type="date"] {
  color-scheme: dark;
}

.time-input-container {
  display: grid;

  grid-template-columns:
    1fr auto 1fr 1fr;

  align-items: center;

  gap: 8px;
}

.time-input-container span {
  color: var(--muted);

  font-weight: 900;
}

.macro-row {
  display: flex;

  justify-content: flex-end;

  gap: 5px;

  margin-bottom: 7px;
}

.macro-row .btn {
  min-height: 30px;

  padding: 5px 9px;

  font-size: 10px;
}


/* =========================
   DAYS
========================= */

.weekday-selector {
  display: grid;

  grid-template-columns:
    repeat(7,1fr);

  gap: 6px;
}

.day-checkbox-label {
  position: relative;

  display: block;

  text-align: center;
}

.day-checkbox-label input {
  position: absolute;

  width: 0;
  height: 0;

  opacity: 0;
}

.day-checkbox-label span {
  display: block;

  padding: 9px 2px;

  color: var(--muted);

  background: #03060f;

  border:
    1px solid var(--line);

  border-radius: 8px;

  font-size: 10px;
  font-weight: 900;

  text-transform: uppercase;

  cursor: pointer;

  transition: .2s ease;
}

.day-checkbox-label span:hover {
  border-color:
    var(--line-light);

  color: #fff;
}

.day-checkbox-label input:checked + span {
  color: #fff;

  background: var(--purple);

  border-color: transparent;

  box-shadow:
    0 0 14px rgba(189,0,255,.25);
}


/* =========================
   FORM ACTIONS
========================= */

.form-actions {
  display: flex;

  justify-content: flex-end;

  gap: 9px;

  margin-top: 6px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes pulse {
  0% {
    opacity: .86;
  }

  50% {
    opacity: 1;
    filter: brightness(1.18);
  }

  100% {
    opacity: .86;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes modalIn {
  from {
    opacity: 0;

    transform:
      translateY(10px)
      scale(.98);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width:850px) {

  .hub-grid {
    grid-template-columns: 1fr;
  }

  .list-container {
    grid-template-columns: 1fr;
  }

}


@media (max-width:600px) {

  .app {
    width:
      min(
        100% - 20px,
        1120px
      );
  }

  .top-center-clock {
    position: relative;

    top: auto;
    left: auto;

    transform: none;

    padding-top: 14px;
  }

  header {
    padding-top: 25px;

    margin-bottom: 20px;

    align-items: flex-start;

    flex-direction: column;
  }

  .brand h1 {
    font-size: 24px;
  }

  .brand p {
    font-size: 11px;
  }

  .file-buttons {
    width: 100%;

    justify-content: flex-start;

    /*
      Keep room for the fixed
      ALL PROJECTS button.
    */
    padding-right: 0;
  }

  .file-buttons .btn {
    flex: 1;
  }

  .file-buttons > a.btn {
    min-height: 58px;

    padding: 14px 18px;

    font-size: 15px;
  }


  /* ALL PROJECTS on mobile */

  .all-projects-button {
    top: 12px;

    right: 135px;

    min-height: 44px;

    padding: 10px 14px;

    font-size: 11px;
  }


  /* New List stays in normal row */

  .file-buttons > button.primary {
    position: static;

    min-height: 58px;

    padding: 14px 18px;

<script>


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "gh_hub_lists_v6";

const RESET_KEY =
  "gh_last_reset_date_v6";

let hubLists =
  loadLists();


function loadLists() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (Array.isArray(parsed)) {

        return parsed;

      }

    }

  } catch(error) {

    console.error(
      "Could not load data:",
      error
    );

  }


  return [

    {

      id: Date.now(),

      title: "Daily Tasks",

      items: [

        {

          id: Date.now() + 1,

          text:
            "Check water and food setups",

          startDate:
            getTodayISO(),

          targetTime:
            "8:00 AM",

          days: [
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat",
            "Sun"
          ],

          done: false,

          completedAt: null,

          isOverdue: false

        },


        {

          id: Date.now() + 2,

          text:
            "Review homework backlog",

          startDate:
            getTodayISO(),

          targetTime:
            "3:30 PM",

          days: [
            "Tue",
            "Wed"
          ],

          done: false,

          completedAt: null,

          isOverdue: false

        }

      ]

    }

  ];

}


function saveStateToStorage() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(hubLists)
    );

  } catch(error) {

    console.error(
      "Could not save data:",
      error
    );

  }

}


/* =========================================================
   DATE HELPERS
========================================================= */

function getTodayISO() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function parseLocalDate(
  dateString
) {

  if (!dateString) {
    return null;
  }

  const parts =
    dateString.split("-");

  if (parts.length !== 3) {
    return null;
  }

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


function formatDate(
  dateString
) {

  const date =
    parseLocalDate(
      dateString
    );

  if (!date) {
    return "No date";
  }

  return new Intl.DateTimeFormat(
    undefined,
    {
      month: "short",
      day: "numeric",
      year: "numeric"
    }
  ).format(date);

}


function formatShortDate(
  dateString
) {

  const date =
    parseLocalDate(
      dateString
    );

  if (!date) {
    return "No date";
  }

  return new Intl.DateTimeFormat(
    undefined,
    {
      month: "short",
      day: "numeric"
    }
  ).format(date);

}


/* =========================================================
   CLOCK
========================================================= */

function runLiveSystemClock() {

  const clockEl =
    document.getElementById(
      "masterLiveClock"
    );

  const dateEl =
    document.getElementById(
      "masterLiveDate"
    );

  if (!clockEl || !dateEl) {
    return;
  }

  const now =
    new Date();

  let hours =
    now.getHours();

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const seconds =
    String(
      now.getSeconds()
    ).padStart(2,"0");

  const ampm =
    hours >= 12
      ? "PM"
      : "AM";

  hours =
    hours % 12 || 12;

  clockEl.textContent =
    `${hours}:${minutes}:${seconds} ${ampm}`;

  dateEl.textContent =
    new Intl.DateTimeFormat(
      undefined,
      {
        weekday: "long",
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(now);

  evaluateMidnightReset();

  checkOverdueTaskStates();

  updateOverdueButtons();

  updateTodayStats();

}


/* =========================================================
   UPDATE SCHOOL / LUCKY BUTTONS
========================================================= */

function updateOverdueButtons() {

  let luckyOverdue = false;

  let schoolOverdue = false;


  hubLists.forEach(
    list => {

      const title =
        String(
          list.title || ""
        ).trim().toLowerCase();


      const hasOverdueTask =
        Array.isArray(list.items) &&
        list.items.some(
          task =>
            !task.done &&
            task.isOverdue === true
        );


      if (
        title.includes("lucky") &&
        hasOverdueTask
      ) {

        luckyOverdue = true;

      }


      if (
        title.includes("school") &&
        hasOverdueTask
      ) {

        schoolOverdue = true;

      }

    }
  );


  const luckyButton =
    document.getElementById(
      "luckyButton"
    );

  const schoolButton =
    document.getElementById(
      "schoolButton"
    );


  if (luckyButton) {

    luckyButton.classList.toggle(
      "overdue-button",
      luckyOverdue
    );

  }


  if (schoolButton) {

    schoolButton.classList.toggle(
      "overdue-button",
      schoolOverdue
    );

  }

}


/* =========================================================
   TABS
========================================================= */

let currentTab =
  "dashboard";


function switchTab(tab) {

  currentTab = tab;


  const dashboardView =
    document.getElementById(
      "dashboardView"
    );

  const upcomingView =
    document.getElementById(
      "upcomingView"
    );

  const completedView =
    document.getElementById(
      "completedView"
    );


  dashboardView.style.display =
    tab === "dashboard"
      ? ""
      : "none";

  upcomingView.style.display =
    tab === "upcoming"
      ? ""
      : "none";

  completedView.style.display =
    tab === "completed"
      ? ""
      : "none";


  document
    .getElementById(
      "dashboardTab"
    )
    .classList.toggle(
      "active",
      tab === "dashboard"
    );


  document
    .getElementById(
      "upcomingTab"
    )
    .classList.toggle(
      "active",
      tab === "upcoming"
    );


  document
    .getElementById(
      "completedTab"
    )
    .classList.toggle(
      "active",
      tab === "completed"
    );


  if (
    tab === "dashboard"
  ) {

    renderDashboard();

  }


  if (
    tab === "upcoming"
  ) {

    renderUpcoming();

  }


  if (
    tab === "completed"
  ) {

    renderCompleted();

  }

}


/* =========================================================
   MODALS
========================================================= */

function openHubModal() {

  const modal =
    document.getElementById(
      "hubListModal"
    );

  modal.classList.add(
    "open"
  );


  setTimeout(
    () => {

      document
        .getElementById(
          "listTitleInput"
        )
        .focus();

    },
    50
  );

}


function closeHubModal() {

  document
    .getElementById(
      "hubListModal"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "listTitleInput"
    )
    .value = "";

}


function closeTaskModal() {

  document
    .getElementById(
      "taskEditModal"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "taskModalForm"
    )
    .reset();

}


function closeModalFromBackground(
  event,
  modalId
) {

  if (
    event.target.id !== modalId
  ) {
    return;
  }


  if (
    modalId === "hubListModal"
  ) {

    closeHubModal();

  }


  if (
    modalId === "taskEditModal"
  ) {

    closeTaskModal();

  }

}


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !== "Escape"
    ) {
      return;
    }

    closeHubModal();

    closeTaskModal();

  }
);


/* =========================================================
   CREATE LIST
========================================================= */

function handleCreateHubList(
  event
) {

  event.preventDefault();


  const input =
    document.getElementById(
      "listTitleInput"
    );


  const title =
    input.value.trim();


  if (!title) {
    return;
  }


  hubLists.push({

    id: Date.now(),

    title: title,

    items: []

  });


  saveStateToStorage();

  closeHubModal();

  renderAll();

  updateOverdueButtons();

}


/* =========================================================
   DELETE LIST
========================================================= */

function deleteHubListTrack(
  listId
) {

  const list =
    hubLists.find(
      item =>
        item.id === listId
    );


  if (!list) {
    return;
  }


  if (
    !confirm(
      `Delete "${list.title}" and all of its tasks?`
    )
  ) {

    return;

  }


  hubLists =
    hubLists.filter(
      item =>
        item.id !== listId
    );


  saveStateToStorage();

  renderAll();

  updateOverdueButtons();

}


/* =========================================================
   OPEN TASK MODAL
========================================================= */

function openTaskModal(
  listId,
  itemId = null
) {

  const modal =
    document.getElementById(
      "taskEditModal"
    );


  const listIdInput =
    document.getElementById(
      "taskModalListId"
    );


  const itemIdInput =
    document.getElementById(
      "taskModalItemId"
    );


  const textInput =
    document.getElementById(
      "taskModalTextInput"
    );


  const dateInput =
    document.getElementById(
      "taskStartDate"
    );


  const hourInput =
    document.getElementById(
      "timeHour"
    );


  const minuteInput =
    document.getElementById(
      "timeMinute"
    );


  const ampmInput =
    document.getElementById(
      "timeAmpm"
    );


  listIdInput.value =
    listId;


  itemIdInput.value =
    itemId || "";


  toggleAllModalDays(
    false
  );


  if (itemId) {

    document
      .getElementById(
        "taskModalHeader"
      )
      .textContent =
      "Edit Checklist Item";


    document
      .getElementById(
        "taskModalSubmitBtn"
      )
      .textContent =
      "Save Changes";


    const list =
      hubLists.find(
        item =>
          item.id === listId
      );


    const task =
      list?.items.find(
        item =>
          item.id === itemId
      );


    if (task) {

      textInput.value =
        task.text || "";


      dateInput.value =
        task.startDate ||
        getTodayISO();


      if (
        task.targetTime &&
        task.targetTime !== "—"
      ) {

        const parts =
          task.targetTime
            .split(" ");


        const time =
          parts[0]
            .split(":");


        hourInput.value =
          parseInt(
            time[0],
            10
          );


        minuteInput.value =
          time[1];


        ampmInput.value =
          parts[1] || "AM";

      } else {

        hourInput.value = "";

        minuteInput.value = "";

        ampmInput.value =
          "AM";

      }


      const activeDays =
        task.days || [];


      document
        .querySelectorAll(
          ".modal-day"
        )
        .forEach(
          checkbox => {

            checkbox.checked =
              activeDays.includes(
                checkbox.value
              );

          }
        );

    }

  } else {

    document
      .getElementById(
        "taskModalHeader"
      )
      .textContent =
      "Add Checklist Item";


    document
      .getElementById(
        "taskModalSubmitBtn"
      )
      .textContent =
      "Create Task";


    textInput.value = "";

    dateInput.value =
      getTodayISO();

    hourInput.value = "";

    minuteInput.value = "";

    ampmInput.value =
      "AM";


    toggleAllModalDays(
      true
    );

  }


  modal.classList.add(
    "open"
  );


  setTimeout(
    () => {

      textInput.focus();

    },
    50
  );

}


/* =========================================================
   DAY SELECTOR
========================================================= */

function toggleAllModalDays(
  status
) {

  document
    .querySelectorAll(
      ".modal-day"
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          status;

      }
    );

}


/* =========================================================
   SAVE TASK
========================================================= */

function handleTaskModalSubmit(
  event
) {

  event.preventDefault();


  const listId =
    parseInt(
      document.getElementById(
        "taskModalListId"
      ).value,
      10
    );


  const itemIdString =
    document.getElementById(
      "taskModalItemId"
    ).value;


  const text =
    document.getElementById(
      "taskModalTextInput"
    ).value.trim();


  const startDate =
    document.getElementById(
      "taskStartDate"
    ).value;


  if (
    !text ||
    !startDate
  ) {

    return;

  }


  const hour =
    document.getElementById(
      "timeHour"
    ).value;


  const minute =
    document.getElementById(
      "timeMinute"
    ).value;


  const ampm =
    document.getElementById(
      "timeAmpm"
    ).value;


  let targetTime =
    "—";


  if (
    hour &&
    minute !== ""
  ) {

    const cleanMinute =
      String(
        minute
      ).padStart(
        2,
        "0"
      );


    targetTime =
      `${hour}:${cleanMinute} ${ampm}`;

  }


  const selectedDays =
    [];


  document
    .querySelectorAll(
      ".modal-day"
    )
    .forEach(
      checkbox => {

        if (
          checkbox.checked
        ) {

          selectedDays.push(
            checkbox.value
          );

        }

      }
    );


  const list =
    hubLists.find(
      item =>
        item.id === listId
    );


  if (!list) {
    return;
  }


  if (itemIdString) {

    const itemId =
      parseInt(
        itemIdString,
        10
      );


    const task =
      list.items.find(
        item =>
          item.id === itemId
      );


    if (task) {

      task.text =
        text;

      task.startDate =
        startDate;

      task.targetTime =
        targetTime;

      task.days =
        selectedDays;

      task.isOverdue =
        false;

    }

  } else {

    list.items.push({

      id: Date.now(),

      text: text,

      startDate:
        startDate,

      targetTime:
        targetTime,

      days:
        selectedDays,

      done: false,

      completedAt: null,

      isOverdue: false

    });

  }


  saveStateToStorage();

  closeTaskModal();

  checkOverdueTaskStates();

  renderAll();

  updateOverdueButtons();

}


/* =========================================================
   TOGGLE TASK
========================================================= */

function toggleChecklistItemState(
  listId,
  itemId
) {

  const list =
    hubLists.find(
      item =>
        item.id === listId
    );


  if (!list) {
    return;
  }


  const task =
    list.items.find(
      item =>
        item.id === itemId
    );


  if (!task) {
    return;
  }


  task.done =
    !task.done;


  if (task.done) {

    task.isOverdue =
      false;

    task.completedAt =
      new Date().toISOString();

  } else {

    task.completedAt =
      null;

  }


  saveStateToStorage();

  renderAll();

  updateOverdueButtons();

}


/* =========================================================
   DELETE TASK
========================================================= */

function deleteSingleChecklistItem(
  listId,
  itemId
) {

  const list =
    hubLists.find(
      item =>
        item.id === listId
    );


  if (!list) {
    return;
  }


  const task =
    list.items.find(
      item =>
        item.id === itemId
    );


  if (!task) {
    return;
  }


  if (
    !confirm(
      `Delete "${task.text}"?`
    )
  ) {

    return;

  }


  list.items =
    list.items.filter(
      item =>
        item.id !== itemId
    );


  saveStateToStorage();

  renderAll();

  updateOverdueButtons();

}


/* =========================================================
   CLEAR COMPLETED
========================================================= */

function clearCompletedTasks() {

  let completedCount =
    0;


  hubLists.forEach(
    list => {

      completedCount +=
        list.items.filter(
          task =>
            task.done
        ).length;

    }
  );


  if (
    completedCount === 0
  ) {

    alert(
      "There are no completed tasks to clear."
    );

    return;

  }


  if (
    !confirm(
      `Clear all ${completedCount} completed task${completedCount === 1 ? "" : "s"}?`
    )
  ) {

    return;

  }


  hubLists.forEach(
    list => {

      list.items =
        list.items.filter(
          task =>
            !task.done
        );

    }
  );


  saveStateToStorage();

  renderAll();

  updateOverdueButtons();

}


/* =========================================================
   TIME PARSER
========================================================= */

function convertTimeToMinutes(
  timeString
) {

  if (
    !timeString ||
    timeString === "—"
  ) {

    return null;

  }


  const parts =
    timeString
      .trim()
      .split(" ");


  if (
    parts.length !== 2
  ) {

    return null;

  }


  const time =
    parts[0]
      .split(":");


  if (
    time.length !== 2
  ) {

    return null;

  }


  let hours =
    parseInt(
      time[0],
      10
    );


  const minutes =
    parseInt(
      time[1],
      10
    );


  const ampm =
    parts[1].toUpperCase();


  if (
    Number.isNaN(hours) ||
    Number.isNaN(minutes)
  ) {

    return null;

  }


  if (
    ampm === "PM" &&
    hours !== 12
  ) {

    hours += 12;

  }


  if (
    ampm === "AM" &&
    hours === 12
  ) {

    hours = 0;

  }


  return (
    hours * 60 +
    minutes
  );

}


/* =========================================================
   DAY CHECK
========================================================= */

function taskRunsToday(
  task
) {

  const today =
    getTodayISO();


  if (
    task.startDate &&
    task.startDate > today
  ) {

    return false;

  }


  const days =
    task.days || [];


  if (
    days.length === 0
  ) {

    return true;

  }


  const dayNames = [

    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"

  ];


  const currentDay =
    dayNames[
      new Date().getDay()
    ];


  return days.includes(
    currentDay
  );

}


/* =========================================================
   UPCOMING CHECK
========================================================= */

function isUpcomingTask(
  task
) {

  if (task.done) {
    return false;
  }


  const today =
    getTodayISO();


  if (
    task.startDate &&
    task.startDate > today
  ) {

    return true;

  }


  return false;

}


/* =========================================================
   OVERDUE ENGINE
========================================================= */

function checkOverdueTaskStates() {

  const now =
    new Date();


  const today =
    getTodayISO();


  const dayNames = [

    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"

  ];


  const currentDay =
    dayNames[
      now.getDay()
    ];


  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  let changed =
    false;


  hubLists.forEach(
    list => {

      if (
        !Array.isArray(
          list.items
        )
      ) {

        return;

      }


      list.items.forEach(
        task => {

          if (task.done) {

            if (
              task.isOverdue
            ) {

              task.isOverdue =
                false;

              changed =
                true;

            }

            return;

          }


          if (
            task.startDate &&
            task.startDate > today
          ) {

            if (
              task.isOverdue
            ) {

              task.isOverdue =
                false;

              changed =
                true;

            }

            return;

          }


          const activeDays =
            task.days || [];


          const dayApplies =
            activeDays.length === 0 ||
            activeDays.includes(
              currentDay
            );


          const targetMinutes =
            convertTimeToMinutes(
              task.targetTime
            );


          if (
            targetMinutes === null
          ) {

            if (
              task.isOverdue
            ) {

              task.isOverdue =
                false;

              changed =
                true;

            }

            return;

          }


          const shouldBeOverdue =
            dayApplies &&
            currentMinutes >=
              targetMinutes;


          if (
            task.isOverdue !==
            shouldBeOverdue
          ) {

            task.isOverdue =
              shouldBeOverdue;

            changed =
              true;

          }

        }
      );

    }
  );


  if (changed) {

    saveStateToStorage();

  }

}


/* =========================================================
   MIDNIGHT RESET
========================================================= */

function evaluateMidnightReset() {

  const today =
    getTodayISO();


  const lastReset =
    localStorage.getItem(
      RESET_KEY
    );


  if (
    lastReset === today
  ) {

    return;

  }


  const dayNames = [

    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"

  ];


  const currentDay =
    dayNames[
      new Date().getDay()
    ];


  let changed =
    false;


  hubLists.forEach(
    list => {

      if (
        !Array.isArray(
          list.items
        )
      ) {

        return;

      }


      list.items.forEach(
        task => {

          const startDate =
            task.startDate ||
            today;


          const hasStarted =
            startDate <= today;


          const days =
            task.days || [];


          const shouldRunToday =
            days.length === 0 ||
            days.includes(
              currentDay
            );


          if (
            hasStarted &&
            shouldRunToday &&
            task.done
          ) {

            if (
              days.length > 0
            ) {

              task.done =
                false;

              task.completedAt =
                null;

              task.isOverdue =
                false;

              changed =
                true;

            }

          }

        }
      );

    }
  );


  localStorage.setItem(
    RESET_KEY,
    today
  );


  if (changed) {

    saveStateToStorage();

  }

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   TASK HTML
========================================================= */

function createTaskHTML(
  list,
  task,
  showStartDate = false
) {

  const activeDays =
    task.days || [];


  const baseDays = [

    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat",
    "Sun"

  ];


  const dayBadges =
    baseDays.map(
      day => {

        const active =
          activeDays.includes(
            day
          );


        return `

          <span
            class="
              mini-day-pill
              ${active ? "active" : ""}
            "
          >
            ${day}
          </span>

        `;

      }
    ).join("");


  const safeText =
    escapeHTML(
      task.text
    );


  const timeHTML =
    task.targetTime !== "—"

      ? `

        <span class="meta-target">
          ⏰
          ${escapeHTML(
            task.targetTime
          )}
        </span>

      `

      : "";


  const dateHTML =
    showStartDate &&
    task.startDate

      ? `

        <span class="meta-date">
          📅
          ${escapeHTML(
            formatShortDate(
              task.startDate
            )
          )}
        </span>

      `

      : "";


  return `

    <div
      class="
        todo-row
        ${task.done ? "done" : ""}
        ${task.isOverdue ? "overdue" : ""}
      "
    >

      <input
        type="checkbox"

        id="
          task-${list.id}-${task.id}
        "

        ${task.done ? "checked" : ""}

        onchange="
          toggleChecklistItemState(
            ${list.id},
            ${task.id}
          )
        "
      >


      <label
        for="
          task-${list.id}-${task.id}
        "
      >
        ${safeText}
      </label>


      <div class="todo-meta">

        ${dateHTML}

        ${timeHTML}

        <div class="days-badge-row">
          ${dayBadges}
        </div>

      </div>


      <button
        class="action-icon-btn"

        title="Edit Task"

        aria-label="Edit Task"

        onclick="
          openTaskModal(
            ${list.id},
            ${task.id}
          )
        "
      >
        ✏️
      </button>


      <button
        class="
          action-icon-btn
          delete
        "

        title="Delete Task"

        aria-label="Delete Task"

        onclick="
          deleteSingleChecklistItem(
            ${list.id},
            ${task.id}
          )
        "
      >
        ✕
      </button>

    </div>

  `;

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

  const container =
    document.getElementById(
      "hubListsWrapper"
    );


  const today =
    getTodayISO();


  let totalToday =
    0;


  let completedToday =
    0;


  hubLists.forEach(
    list => {

      if (
        !Array.isArray(
          list.items
        )
      ) {

        return;

      }


      list.items.forEach(
        task => {

          if (
            task.startDate &&
            task.startDate > today
          ) {

            return;

          }


          if (
            taskRunsToday(task)
          ) {

            totalToday++;


            if (task.done) {

              completedToday++;

            }

          }

        }
      );

    }
  );


  document.getElementById(
    "todaySubtitle"
  ).textContent =
    `${totalToday} active today • ${completedToday} completed`;


  if (
    hubLists.length === 0
  ) {

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;"
      >

        No tracking lists yet.

        <br><br>

        Click
        <strong>＋ New List</strong>
        to create your first list.

      </div>

    `;

    return;

  }


  container.innerHTML =
    hubLists.map(
      list => {

        const items =
          Array.isArray(
            list.items
          )
            ? list.items
            : [];


        const todayItems =
          items.filter(
            task =>
              taskRunsToday(
                task
              )
          );


        const completed =
          todayItems.filter(
            task =>
              task.done
          ).length;


        const taskHTML =
          todayItems.map(
            task =>
              createTaskHTML(
                list,
                task,
                true
              )
          ).join("");


        return `

          <section
            class="dynamic-list-card"
          >

            <div class="list-header">

              <div class="list-title-wrap">

                <h2>
                  ${escapeHTML(
                    list.title
                  )}
                </h2>

                <div class="list-count">

                  ${completed}/${todayItems.length}
                  completed

                </div>

              </div>


              <button
                class="btn danger"

                onclick="
                  deleteHubListTrack(
                    ${list.id}
                  )
                "
              >
                Delete
              </button>

            </div>


            <div class="item-box">

              ${
                todayItems.length === 0

                  ? `

                    <div class="empty">

                      No active tasks for today.

                      <br><br>

                      Add a task using the
                      <strong>＋ Add Task</strong>
                      button below.

                    </div>

                  `

                  : taskHTML
              }

            </div>


            <button
              class="btn"
              style="width:100%;"

              onclick="
                openTaskModal(
                  ${list.id}
                )
              "
            >
              ＋ Add Task
            </button>

          </section>

        `;

      }
    ).join("");

}


/* =========================================================
   UPCOMING
========================================================= */

function renderUpcoming() {

  const container =
    document.getElementById(
      "upcomingContainer"
    );


  const today =
    getTodayISO();


  const upcomingGroups =
    [];


  hubLists.forEach(
    list => {

      const items =
        Array.isArray(
          list.items
        )
          ? list.items
          : [];


      const upcoming =
        items.filter(
          task =>
            !task.done &&
            task.startDate &&
            task.startDate > today
        );


      if (
        upcoming.length > 0
      ) {

        upcomingGroups.push({
          list,
          items: upcoming
        });

      }

    }
  );


  if (
    upcomingGroups.length === 0
  ) {

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;"
      >

        No upcoming tasks.

        <br><br>

        Tasks with a future start date
        will appear here.

      </div>

    `;

    return;

  }


  upcomingGroups.forEach(
    group => {

      group.items.sort(
        (a,b) =>
          a.startDate.localeCompare(
            b.startDate
          )
      );

    }
  );


  container.innerHTML =
    upcomingGroups.map(
      group => {

        const list =
          group.list;


        const items =
          group.items;


        const taskHTML =
          items.map(
            task =>
              createTaskHTML(
                list,
                task,
                true
              )
          ).join("");


        return `

          <section
            class="dynamic-list-card"
          >

            <div class="list-header">

              <div class="list-title-wrap">

                <h2>
                  ${escapeHTML(
                    list.title
                  )}
                </h2>

                <div class="list-count">

                  ${items.length}
                  upcoming

                </div>

              </div>

            </div>


            <div class="item-box">
              ${taskHTML}
            </div>


            <button
              class="btn"
              style="width:100%;"

              onclick="
                openTaskModal(
                  ${list.id}
                )
              "
            >
              ＋ Add Task
            </button>

          </section>

        `;

      }
    ).join("");

}


/* =========================================================
   COMPLETED
========================================================= */

function renderCompleted() {

  const container =
    document.getElementById(
      "completedContainer"
    );


  const completedGroups =
    [];


  hubLists.forEach(
    list => {

      const items =
        Array.isArray(
          list.items
        )
          ? list.items
          : [];


      const completed =
        items.filter(
          task =>
            task.done
        );


      if (
        completed.length > 0
      ) {

        completedGroups.push({
          list,
          items: completed
        });

      }

    }
  );


  if (
    completedGroups.length === 0
  ) {

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;"
      >

        No completed tasks yet.

        <br><br>

        Finish a task from the
        Dashboard and it will appear here.

      </div>

    `;

    return;

  }


  container.innerHTML =
    completedGroups.map(
      group => {

        const list =
          group.list;


        const items =
          group.items;


        const taskHTML =
          items.map(
            task =>
              createTaskHTML(
                list,
                task,
                true
              )
          ).join("");


        return `

          <section
            class="dynamic-list-card"
          >

            <div class="list-header">

              <div class="list-title-wrap">

                <h2>
                  ${escapeHTML(
                    list.title
                  )}
                </h2>

                <div class="list-count">

                  ${items.length}
                  completed

                </div>

              </div>

            </div>


            <div class="item-box">
              ${taskHTML}
            </div>

          </section>

        `;

      }
    ).join("");

}
